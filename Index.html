    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .controls {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            width: 90%;
            text-align: center;
            opacity: 0.6;
            transition: opacity 0.3s;
        }
        .controls:hover {
            opacity: 1;
        }
        input[type="file"] {
            font-size: 12px;
            color: white;
        }

        .screen-container {
            width: 100vw;
            aspect-ratio: 16 / 9;
            background-color: #fff;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        @media (orientation: portrait) {
            .screen-container {
                width: 100vw; 
                max-height: 56.25vw;
            }
        }

        #viewer {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        .placeholder-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #999;
            font-size: 14px;
            text-align: center;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="controls">
        <input type="file" id="fileInput" accept=".html">
    </div>

    <div class="screen-container">
        <div id="placeholder" class="placeholder-text">HTMLファイルを選択してください</div>
        <iframe id="viewer"></iframe>
    </div>

    <script>
        // --- PWA Service Worker (インライン実装) ---
        if ('serviceWorker' in navigator) {
            const swCode = `
                self.addEventListener('install', e => self.skipWaiting());
                self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => {})));
            `;
            const blob = new Blob([swCode], { type: 'text/javascript' });
            const swUrl = URL.createObjectURL(blob);
            navigator.serviceWorker.register(swUrl).catch(err => console.log('SW failed', err));
        }

        // --- メイン機能 ---
        const fileInput = document.getElementById('fileInput');
        const viewer = document.getElementById('viewer');
        const placeholder = document.getElementById('placeholder');

        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const htmlContent = event.target.result;
                const blob = new Blob([htmlContent], { type: 'text/html' });
                const url = URL.createObjectURL(blob);
                
                viewer.src = url;
                placeholder.style.display = 'none';
            };
            reader.readAsText(file);
        });
    </script>
</body>
</html>
